<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PedroModz666 - Panel de Licencias</title>
    <!-- Tailwind CSS para un diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const FIREBASE_URL = "https://pedromodz-keys-default-rtdb.firebaseio.com/keys.json";

        async function generarKey() {
            const keyInput = document.getElementById("customKey").value.trim();
            const diasInput = parseInt(document.getElementById("diasInput").value) || 1;
            const tipoLicencia = document.getElementById("tipoLicencia").value; // VIP o Normal
            const resultadoDiv = document.getElementById("resultado");

            const keyFinal = keyInput !== "" ? keyInput : "VIP-" + Math.random().toString(36.substring(2, 9)).toUpperCase();
            const ahora = Math.floor(Date.now() / 1000);
            const expiracion = ahora + (diasInput * 86400);

            const datos = {
                status: "active",
                type: tipoLicencia, // Guarda si es VIP o Normal
                expires: expiracion,
                created: ahora
            };

            try {
                const response = await fetch(`https://pedromodz-keys-default-rtdb.firebaseio.com/keys/${keyFinal}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                if (response.ok) {
                    resultadoDiv.innerHTML = `<div class="p-3 bg-green-600 text-white rounded mt-4">¡Key <b>${tipoLicencia.toUpperCase()}</b> creada con éxito!<br><b>${keyFinal}</b></div>`;
                    cargarKeys();
                } else {
                    resultadoDiv.innerHTML = `<div class="p-3 bg-red-600 text-white rounded mt-4">Error al crear la key en Firebase.</div>`;
                }
            } catch (error) {
                resultadoDiv.innerHTML = `<div class="p-3 bg-red-600 text-white rounded mt-4">Error de conexión con la base de datos.</div>`;
            }
        }

        async function cargarKeys() {
            try {
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();
                const lista = document.getElementById("listaKeys");
                lista.innerHTML = "";

                if (data) {
                    Object.keys(data).forEach(key => {
                        const info = data[key];
                        const tipoBadge = info.type === 'vip' 
                            ? '<span class="bg-yellow-500 text-black px-2 py-0.5 rounded text-xs font-bold">VIP</span>' 
                            : '<span class="bg-blue-500 text-white px-2 py-0.5 rounded text-xs font-bold">NORMAL</span>';

                        lista.innerHTML += `
                            <div class="flex justify-between items-center bg-gray-700 p-3 rounded mb-2">
                                <div>
                                    <span class="font-mono text-green-400 font-bold">${key}</span> ${tipoBadge}
                                </div>
                                <button onclick="eliminarKey('${key}')" class="bg-red-500 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">Eliminar</button>
                            </div>`;
                    });
                }
            } catch (error) {
                console.error("Error cargando licencias");
            }
        }

        async function eliminarKey(key) {
            if (confirm(`¿Seguro que deseas eliminar la key ${key}?`)) {
                await fetch(`https://pedromodz-keys-default-rtdb.firebaseio.com/keys/${key}.json`, { method: 'DELETE' });
                cargarKeys();
            }
        }

        window.onload = cargarKeys;
    </script>
</head>
<body class="bg-gray-900 text-white min-p-6 font-sans">
    <div class="max-w-md mx-auto mt-10 bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-700">
        <h1 class="text-2xl font-bold text-center text-green-400 mb-6">PedroModz666 Panel</h1>
        
        <!-- Formulario para Crear Keys -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Key Personalizada (Opcional):</label>
                <input type="text" id="customKey" placeholder="Ej: PEDRO-VIP-2026" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500">
            </div>
            
            <div class="flex gap-2">
                <div class="w-1/2">
                    <label class="block text-sm font-medium mb-1">Duración (Días):</label>
                    <input type="number" id="diasInput" value="1" min="1" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500">
                </div>
                <div class="w-1/2">
                    <label class="block text-sm font-medium mb-1">Tipo de Licencia:</label>
                    <select id="tipoLicencia" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500">
                        <option value="normal">Normal</option>
                        <option value="vip">VIP</option>
                    </select>
                </div>
            </div>

            <button onclick="generarKey()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold p-2 rounded transition">Generar Licencia</button>
        </div>

        <div id="resultado"></div>

        <!-- Lista de Keys Activas -->
        <div class="mt-8">
            <h2 class="text-lg font-bold mb-3 border-b border-gray-700 pb-2">Licencias Generadas</h2>
            <div id="listaKeys" class="max-h-60 overflow-y-auto">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>
    </div>
</body>
</html>

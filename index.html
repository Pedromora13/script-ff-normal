<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Keys - PedroModz666</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --accent: #e83434; --text: #f0f0f0; --text-d: #a8a8a8; --border: #2a2a2a; }
        * {margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:20px;min-height:100vh;}
        h1{font-family:'Space Grothes',monospace;font-size:2.2rem;color:var(--accent);margin-bottom:20px;}
        .container{max-width:900px;margin:0 auto;}
        .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:20px;}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px;}
        input[type="text"],input[type="date"],select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:1rem;}
        button{padding:12px 24px;border:none;border-radius:6px;cursor:pointer;font-size:1rem;font-weight:600;transition:opacity 0.2s;}
        button:hover{opacity:0.8;}
        .btn-primary{background:var(--accent);color:#fff;}
        .btn-danger{background:#dc2626;color:#fff;}
        .btn-success{background:#2e7e32;color:#fff;}
        table{width:100%;border-collapse:collapse;margin-top:20px;}
        th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border);}
        th{color:var(--accent);font-weight:600;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.5px;}
        .status{padding:4px 8px;border-radius:4px;font-size:0.85rem;font-weight:600;}
        .status.active{background:#2e7e32;color:#fff;}
        .status.inactive{background:#666;color:#fff;}
        .empty{text-align:center;color:var(--text-d);padding:40px;font-style:italic;}
        .actions{display:flex;gap:8px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡️ Admin Keys</h1>
        
        <div class="card">
            <h3 style="color:var(--accent); margin-bottom:15px;">❏ Crear nueva key</h3>
            <div class="form-grid">
                <input type="text" id="newkey" placeholder="Key única (Ej: VIP-PEDRO)" maxlength="32">
                <input type="date" id="expires">
                <select id="type">
                    <option value="vip">VIP</option>
                    <option value="normal">Normal</option>
                </select>
            </div>
            <button class="btn-primary" onclick="createKey()">Crear key</button>
        </div>
        
        <div class="card">
            <h3 style="color:var(--accent); margin-bottom:15px;">📋 Keys activas</h3>
            <table>
                <thead>
                    <tr><th>Key</th><th>Tipo</th><th>Expira</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody id="keyslist"></tbody>
            </table>
        </div>
    </div>

    <script>
        const FIREBASE_URL = 'https://pedromodz-keys-default-rtdb.firebaseio.com/keys';
        
        let keysData = {};
        
        async function loadKeys() {
            try {
                const r = await fetch(FIREBASE_URL + '.json?v=' + Date.now());
                keysData = await r.json() || {};
                renderKeys();
            } catch(e) {
                document.getElementById('keyslist').innerHTML = '<tr><td colspan="5" class="empty">Error cargando keys de Firebase</td></tr>';
            }
        }
        
        function renderKeys() {
            const tbl = document.getElementById('keyslist');
            const keysArray = Object.keys(keysData);
            
            if (!keysArray.length) {
                tbl.innerHTML = '<tr><td colspan="5" class="empty">No hay keys registradas</td></tr>';
                return;
            }
            
            tbl.innerHTML = keysArray.map(k => {
                const item = keysData[k];
                const isActive = item.status === 'active';
                
                // Calcular días restantes si tiene fecha de expiración
                let expText = 'Sin expiración';
                if (item.expires) {
                    const expDate = new Date(item.expires);
                    const today = new Date();
                    const diffTime = expDate - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    expText = `${diffDays} días (${item.expires})`;
                }

                const tipoRango = (item.type || 'normal').toUpperCase();
                const badgeColor = item.type === 'vip' ? 'background:#eab308;color:#000;' : 'background:#3b82f6;color:#fff;';

                return `
                    <tr>
                        <td><code>${k}</code></td>
                        <td><span style="padding:3px 8px;border-radius:4px;font-size:0.75rem;font-weight:bold;${badgeColor}">${tipoRango}</span></td>
                        <td>${expText}</td>
                        <td><span class="status ${isActive ? 'active' : 'inactive'}">${isActive ? 'activa' : 'inactiva'}</span></td>
                        <td class="actions">
                            <button class="btn-success" onclick="toggleStatus('${k}')">${isActive ? 'Desactivar' : 'Activar'}</button>
                            <button class="btn-danger" onclick="deleteKey('${k}')">Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        async function createKey() {
            const keyInput = document.getElementById('newkey').value.trim();
            const expiresInput = document.getElementById('expires').value;
            const typeInput = document.getElementById('type').value;
            
            if (!keyInput) {
                alert('Ingresa una key válida');
                return;
            }
            
            if (keysData[keyInput]) {
                alert('Ya existe una key con ese nombre en la base de datos');
                return;
            }
            
            // Convertir la fecha seleccionada en timestamp o dejarla como texto legible
            const nuevaKeyData = {
                status: 'active',
                expires: expiresInput || null,
                type: typeInput,
                created: Math.floor(Date.now() / 1000)
            };
            
            try {
                const response = await fetch(`${FIREBASE_URL}/${keyInput}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevaKeyData)
                });

                if (response.ok) {
                    document.getElementById('newkey').value = '';
                    document.getElementById('expires').value = '';
                    loadKeys();
                } else {
                    alert('Error al guardar en Firebase');
                }
            } catch (error) {
                alert('Error de red al conectar con Firebase');
            }
        }
        
        async function toggleStatus(key) {
            const item = keysData[key];
            if (!item) return;
            
            item.status = item.status === 'active' ? 'inactive' : 'active';
            
            await fetch(`${FIREBASE_URL}/${key}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            });
            
            loadKeys();
        }
        
        async function deleteKey(key) {
            if (!confirm(`¿Estás seguro de eliminar la key ${key}?`)) return;
            
            await fetch(`${FIREBASE_URL}/${key}.json`, {
                method: 'DELETE'
            });
            
            loadKeys();
        }
        
        loadKeys();
    </script>
</body>
</html>

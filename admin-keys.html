<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Keys - PedroModz666</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --accent: #e83434; --text: #f0f0f0; --text-d: #a8a8a8; --border: #2a2a2a; }
        * {margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:20px;min-height:100vh;}
        h1{font-family:'Space Grothes',monospace;font-size:2.2rem;color:var(--accent);margin-bottom:20px;}
        .container{max-width:900px;margin:0 auto;}
        .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:20px;}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px;}
        input[type="text"],input[type="date"],select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:1rem;}
        button{padding:12px 24px;border:none;border-radius:6px;cursor:pointer;font-size:1rem;font-weight:600;transition:opacity 0.2s;}
        button:hover{opacity:0.8;}
        .btn-primary{background:var(--accent);color:#fff;}
        .btn-danger{background:#dc2626;color:#fff;}
        .btn-success{background:#2e7e32;color:#fff;}
        table{width:100%;border-collapse:collapse;margin-top:20px;}
        th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border);}
        th{color:var(--accent);font-weight:600;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.5px;}
        .status{padding:4px 8px;border-radius:4px;font-size:0.85rem;font-weight:600;}
        .status.active{background:#2e7e32;color:#fff;}
        .status.inactive{background:#666;color:#fff;}
        .empty{text-align:center;color:var(--text-d);padding:40px;font-style:italic;}
        .actions{display:flex;gap:8px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡️ Admin Keys</h1>
        
        <div class="card">
            <h3 color="var(--accent)">❏ Crear nueva key</h3>
            <div class="form-grid">
                <input type="text" id="newkey" placeholder="Key uniqua" maxlength="32">
                <input type="date" id="expires">
                <select id="type">
                    <option value="vip">VIP</option>
                    <option value="normal">Normal</option>
                </select>
            </div>
            <button class="btn-primary" onclick="createKey()">Crear key</button>
        </div>
        
        <div class="card">
            <h3 color="var(--accent)">📋 Keys activas</h3>
            <table>
                <thead>
                    <tr><th>Key</th><th>Tipo</th><th>Expira</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody id="keyslist"></tbody>
            </table>
        </div>
    </div>

    <script>
        const REPO_URL = 'https://raw.githubusercontent.com/Pedromora13/script-ff-normal/main/keys.json';
        
        let keysData = [];
        
        async function loadKeys() {
            try {
                const r = await fetch(REPO_URL + '?v=' + Date.now());
                keysData = await r.json();
                renderKeys();
            } catch(e) {
                document.getElementById('keyslist').innerHTML = '<tr><td colspan="5" class="empty">Error cargando keys</td></tr>';
            }
        }
        
        function renderKeys() {
            const tbl = document.getElementById('keyslist');
            if (!keysData.length) {
                tbl.innerHTML = '<tr><td colspan="5" class="empty">No hay keys registradas</td></tr>';
                return;
            }
            tbl.innerHTML = keysData.map(k => {
                const isActive = k.status === 'active';
                const expDays = k.expires ? Math.ceil((new Date(k.expires) - new Date()) / (864e5)) : null;
                const expText = k.expires ? (isActive && expDays < 0 ? `<span style="color:#dc2626">${expDays}días</span>` : `${expDays}días | ${k.expires}`) : 'Sin' expiración';
                return `
                    <tr>
                        <td><code>${k.key}</code></td>
                        <td>${k.type || 'VIP'}</td>
                        <td>${expText}</td>
                        <td><span class="status ${isActive ? 'active' : 'inactive'}">${isActive ? 'activa' : 'inactive'}</span></td>
                        <td class="actions">
                            <button class="btn-success" onclick="toggleStatus('${k.key}')">${isActive ? 'Desactivar' : 'Activar'}</button>
                            <button class="btn-danger" onclick="deleteKey('${k.key}')">Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        async function createKey() {
            const key = document.getElementById('newKey').value.trim();
            const expires = document.getElementById('expires').value;
            const type = document.getElementById('type').value;
            
            if (!key) {
                alert('Ingresa una key');
                return;
            }
            
            if (keysData.some(k => k.key === key)) {
                alert('Existe una key con ese nombre');
                return;
            }
            
            keysData.push({
                key: key,
                status: 'active',
                expires: expires || null,
                device: null,
                type: type
            });
            
            await saveKeys();
            loadKeys();
            document.getElementById('newkey').value = '';
            document.getElementById('expires').value = '';
        }
        
        async function toggleStatus(key) {
            const k = keysData.find(k => k.key === key);
            if (k) k.status = k.status === 'active' ? 'inactive' : 'active';
            await saveKeys();
            loadKeys();
        }
        
        async function deleteKey(key) {
            if (!confirm(`Tenes certeza de eliminar la key ${key}?`)) return;
            keysData = keysData.filter(k => k.key !== key);
            await saveKeys();
            loadKeys();
        }
        
        async function saveKeys() {
            alert('Función de guardar: necesitas un backend. Las keys se guardan en memoria solo para esta sesión.');
        }
        
        loadKeys();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Admin Keys - PedroModz666</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0,212,255,0.3);
            margin-bottom: 8px;
            font-size: 1.5em;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.85em;
            margin-bottom: 25px;
        }
        .panel {
            background: #141414;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .panel h2 {
            color: #00d4ff;
            font-size: 0.95em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 1em;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #00d4ff; }
        button {
            width: 100%;
            padding: 14px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: #33ddff; transform: translateY(-1px); }
        button:active { transform: scale(0.98); }
        button.danger {
            background: #ff4444;
            color: #fff;
        }
        button.danger:hover { background: #ff6666; }
        button.secondary {
            background: #333;
            color: #fff;
        }
        .key-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #0a0a0a;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #222;
        }
        .key-name {
            font-family: monospace;
            font-size: 1.05em;
            color: #00ff88;
        }
        .key-date {
            font-size: 0.75em;
            color: #666;
            margin-top: 2px;
        }
        .btn-small {
            width: auto;
            padding: 8px 16px;
            font-size: 0.8em;
            border-radius: 8px;
        }
        .empty {
            text-align: center;
            color: #555;
            padding: 30px;
        }
        .status {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
            display: none;
        }
        .status.show { display: block; }
        .status.ok { background: #0a3320; color: #00ff88; border: 1px solid #1a5c3a; }
        .status.err { background: #331010; color: #ff6666; border: 1px solid #5c1a1a; }
        .status.info { background: #0a2033; color: #66bbff; border: 1px solid #1a3a5c; }
        .hidden { display: none !important; }
        .login-screen { text-align: center; padding-top: 60px; }
        .login-screen .panel { margin-top: 30px; }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-box {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #222;
        }
        .stat-num {
            font-size: 1.8em;
            font-weight: 800;
            color: #00d4ff;
        }
        .stat-label {
            font-size: 0.75em;
            color: #888;
            margin-top: 4px;
        }
        .token-hint {
            font-size: 0.8em;
            color: #666;
            margin-top: 8px;
            line-height: 1.5;
        }
        .token-hint a { color: #00d4ff; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div id="loginScreen" class="login-screen">
            <h1>🔐 PANEL ADMIN</h1>
            <p class="subtitle">PedroModz666 - Gestión de Keys</p>
            <div class="panel">
                <h2>🔑 Token de GitHub</h2>
                <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                <button onclick="login()">Acceder al Panel</button>
                <p class="token-hint">
                    Necesitas un token con permiso <code>repo</code>.<br>
                    Crealo en: <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a>
                </p>
            </div>
        </div>

        <!-- PANEL PRINCIPAL -->
        <div id="mainScreen" class="hidden">
            <h1>🔐 PANEL ADMIN</h1>
            <p class="subtitle" id="userDisplay">Cargando...</p>
            
            <div id="statusBox" class="status"></div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-num" id="totalKeys">0</div>
                    <div class="stat-label">Keys activas</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="adminKey">—</div>
                    <div class="stat-label">Key maestra</div>
                </div>
            </div>

            <div class="panel">
                <h2>➕ Nueva Key</h2>
                <input type="text" id="newKey" placeholder="Nombre de la key (ej: Caleb6)">
                <button onclick="addKey()">Agregar Key</button>
            </div>

            <div class="panel">
                <h2>📋 Keys Activas</h2>
                <div class="key-list" id="keyList">
                    <div class="empty">Cargando...</div>
                </div>
            </div>

            <div class="panel">
                <button class="secondary" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <script>
        const REPO = 'Pedromora13/script-ff-normal';
        const FILE_PATH = 'keys.txt';
        let token = '';
        let currentSha = '';
        let keys = [];

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.textContent = msg;
            box.className = 'status show ' + type;
            setTimeout(() => box.className = 'status', 4000);
        }

        async function githubApi(method, path, body) {
            const opts = {
                method,
                headers: {
                    'Authorization': 'token ' + token,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                }
            };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch('https://api.github.com' + path, opts);
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || 'Error HTTP ' + res.status);
            }
            return res.status === 204 ? null : res.json();
        }

        async function login() {
            token = document.getElementById('tokenInput').value.trim();
            if (!token) return showStatus('Ingresa un token', 'err');
            
            try {
                const user = await githubApi('GET', '/user');
                document.getElementById('userDisplay').textContent = '@' + user.login;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
                await loadKeys();
            } catch (e) {
                showStatus('Token inválido: ' + e.message, 'err');
            }
        }

        function logout() {
            token = '';
            currentSha = '';
            keys = [];
            document.getElementById('tokenInput').value = '';
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        async function loadKeys() {
            try {
                const file = await githubApi('GET', `/repos/${REPO}/contents/${FILE_PATH}`);
                currentSha = file.sha;
                const content = atob(file.content.replace(/\n/g, ''));
                keys = content.split('\n').map(k => k.trim()).filter(k => k);
                
                document.getElementById('totalKeys').textContent = keys.length;
                const hasAdmin = keys.includes('PedroModz666');
                document.getElementById('adminKey').textContent = hasAdmin ? '✓' : '✗';
                if (!hasAdmin) showStatus('¡Falta la key maestra PedroModz666!', 'err');
                
                renderKeys();
            } catch (e) {
                showStatus('Error cargando keys: ' + e.message, 'err');
            }
        }

        function renderKeys() {
            const list = document.getElementById('keyList');
            if (!keys.length) {
                list.innerHTML = '<div class="empty">No hay keys registradas</div>';
                return;
            }
            list.innerHTML = keys.map((k, i) => `
                <div class="key-item">
                    <div>
                        <div class="key-name">${escapeHtml(k)}</div>
                        ${k === 'PedroModz666' ? '<div class="key-date">🔥 Key maestra</div>' : ''}
                    </div>
                    <button class="danger btn-small" onclick="deleteKey(${i})">Eliminar</button>
                </div>
            `).join('');
        }

        function escapeHtml(t) {
            return t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
        }

        async function saveKeys() {
            const content = btoa(keys.join('\n') + (keys.length ? '\n' : ''));
            await githubApi('PUT', `/repos/${REPO}/contents/${FILE_PATH}`, {
                message: 'Actualizar keys desde panel admin',
                content: content,
                sha: currentSha
            });
        }

        async function addKey() {
            const input = document.getElementById('newKey');
            const key = input.value.trim();
            if (!key) return showStatus('Ingresa una key', 'err');
            if (keys.includes(key)) return showStatus('Esa key ya existe', 'err');
            if (!/^[a-zA-Z0-9_-]+$/.test(key)) return showStatus('Solo letras, números, guiones y guiones bajos', 'err');
            
            try {
                keys.push(key);
                await saveKeys();
                input.value = '';
                await loadKeys();
                showStatus('Key agregada: ' + key, 'ok');
            } catch (e) {
                keys.pop();
                showStatus('Error guardando: ' + e.message, 'err');
            }
        }

        async function deleteKey(index) {
            const key = keys[index];
            if (!confirm('¿Eliminar key "' + key + '"?')) return;
            
            try {
                keys.splice(index, 1);
                await saveKeys();
                await loadKeys();
                showStatus('Key eliminada', 'ok');
            } catch (e) {
                await loadKeys();
                showStatus('Error eliminando: ' + e.message, 'err');
            }
        }

        // Auto-login si hay token guardado
        const saved = localStorage.getItem('gh_token');
        if (saved) {
            document.getElementById('tokenInput').value = saved;
        }
        document.getElementById('tokenInput').addEventListener('change', e => {
            localStorage.setItem('gh_token', e.target.value);
        });
    </script>
</body>
</html>
